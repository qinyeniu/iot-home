version: '3.8'

services:
  # MQTT 消息中间件（最小化配置）
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    environment:
      - TZ=Asia/Shanghai
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 50M
        reservations:
          cpus: '0.05'
          memory: 25M
    networks:
      - iot-network

  # MySQL 数据库（优化配置）
  mysql:
    image: mysql:8.0
    container_name: iot-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=\
      - MYSQL_DATABASE=\
      - MYSQL_USER=\
      - MYSQL_PASSWORD=\
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb_buffer_pool_size=64M
      --innodb_log_file_size=16M
      --max_connections=50
      --query_cache_type=1
      --query_cache_size=16M
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.15'
          memory: 128M
    networks:
      - iot-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p\"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端（最小化配置）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=\
      - MQTT_PASSWORD=\
      - MQTT_TOPIC_PREFIX=\
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=\
      - MYSQL_USER=\
      - MYSQL_PASSWORD=\
      - TZ=Asia/Shanghai
    volumes:
      - ./backend:/app
    depends_on:
      mosquitto:
        condition: service_started
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - iot-network

  # Grafana 可视化（最小化配置）
  grafana:
    image: grafana/grafana:11.2.0
    container_name: iot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=\
      - GF_SECURITY_ADMIN_PASSWORD=\
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - TZ=Asia/Shanghai
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - mysql
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - iot-network

volumes:
  mosquitto_data:
  mosquitto_log:
  mysql_data:
  grafana_data:

networks:
  iot-network:
    driver: bridge
