version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot-mosquitto
    restart: no
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
    environment:
      - TZ=Asia/Shanghai
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 30M
    networks:
      - iot-network

  mysql:
    image: mysql:8.0
    container_name: iot-mysql
    restart: no
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=20051030hjbHJB
      - MYSQL_DATABASE=iot_home
      - MYSQL_USER=iot_home
      - MYSQL_PASSWORD=20051030hjbHJB
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password --innodb_buffer_pool_size=32M --max_connections=20
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    networks:
      - iot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot-backend
    restart: no
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=iot_user
      - MQTT_PASSWORD=20051030hjbHJB
      - MQTT_TOPIC_PREFIX=iot-home
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=iot_home
      - MYSQL_USER=iot_home
      - MYSQL_PASSWORD=20051030hjbHJB
      - TZ=Asia/Shanghai
    volumes:
      - ./backend:/app
    depends_on:
      - mosquitto
      - mysql
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    networks:
      - iot-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: iot-grafana
    restart: no
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=20051030hjbHJB
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - TZ=Asia/Shanghai
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - mysql
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    networks:
      - iot-network

volumes:
  mosquitto_data:
  mysql_data:
  grafana_data:

networks:
  iot-network:
    driver: bridge
