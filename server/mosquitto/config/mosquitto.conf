# Mosquitto MQTT configuration for IoT-Home.
# The container start script appends generated authentication settings to a
# writable runtime copy in /mosquitto/data.

# Authentication/ACL settings appended by start.sh apply to every listener.
per_listener_settings false

# MQTT over TCP.
listener 1883
protocol mqtt

# MQTT over WebSocket. Docker Compose publishes this port for browser/local tools.
listener 9001
protocol websockets

set_tcp_nodelay true
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

max_connections -1
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 1048576
