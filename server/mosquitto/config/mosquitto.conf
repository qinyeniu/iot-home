# Mosquitto MQTT 配置文件（简化版）
# iot-home 项目专用

# 监听端口
listener 1883

# 允许匿名连接（开发环境）
allow_anonymous true

# 持久化
persistence true
persistence_location /mosquitto/data/

# 日志
log_dest stdout
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

# 连接设置
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# 消息大小限制
message_size_limit 1048576
