version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    environment:
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_BACKEND_USER=${MQTT_BACKEND_USER:-}
      - MQTT_BACKEND_PASSWORD=${MQTT_BACKEND_PASSWORD:-}
      - MQTT_GATEWAY_USER=${MQTT_GATEWAY_USER:-}
      - MQTT_GATEWAY_PASSWORD=${MQTT_GATEWAY_PASSWORD:-}
      - MQTT_GATEWAY_ID=${MQTT_GATEWAY_ID:-gw-001}
      - MQTT_ENABLE_LEGACY_ACCOUNT=${MQTT_ENABLE_LEGACY_ACCOUNT:-false}
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX}
      - MQTT_ALLOW_ANONYMOUS=${MQTT_ALLOW_ANONYMOUS:-false}
      - TZ=Asia/Shanghai
    entrypoint: ["/bin/sh"]
    command: ["/mosquitto/config/start.sh"]
    networks:
      - iot-network

  mysql:
    image: mysql:8.0
    container_name: iot-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    networks:
      - iot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER:-iot_user}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_BACKEND_USER=${MQTT_BACKEND_USER:-}
      - MQTT_BACKEND_PASSWORD=${MQTT_BACKEND_PASSWORD:-}
      - MQTT_GATEWAY_ID=${MQTT_GATEWAY_ID:-gw-001}
      - MQTT_ENABLE_LEGACY_ACCOUNT=${MQTT_ENABLE_LEGACY_ACCOUNT:-false}
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-iot-home-backend}
      - DEVICE_OFFLINE_TIMEOUT_SECONDS=${DEVICE_OFFLINE_TIMEOUT_SECONDS:-180}
      - DEVICE_STATUS_CHECK_INTERVAL_SECONDS=${DEVICE_STATUS_CHECK_INTERVAL_SECONDS:-20}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=Asia/Shanghai
    volumes:
      - ./backend:/app
    depends_on:
      - mosquitto
      - mysql
    networks:
      - iot-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: iot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - TZ=Asia/Shanghai
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - mysql
    networks:
      - iot-network

volumes:
  mosquitto_data:
  mosquitto_log:
  mysql_data:
  grafana_data:

networks:
  iot-network:
    driver: bridge
